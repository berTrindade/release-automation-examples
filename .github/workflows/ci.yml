name: CI

on:
  push:
    branches: [main, master, manual-release, auto-release]
  pull_request:
    branches: [main, master, manual-release, auto-release]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --coverage
      - name: Build (pack)
        run: npm run build
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*.tgz
