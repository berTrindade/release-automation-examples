<svg width="1280" height="640" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#grad1)"/>
  
  <!-- Decorative Elements -->
  <circle cx="1100" cy="100" r="150" fill="#60a5fa" opacity="0.1"/>
  <circle cx="200" cy="500" r="200" fill="#60a5fa" opacity="0.1"/>
  
  <!-- Main Content Container -->
  <rect x="80" y="160" width="1120" height="320" rx="20" fill="#1e293b" opacity="0.8"/>
  
  <!-- Icon/Logo Area -->
  <circle cx="180" cy="320" r="60" fill="#3b82f6"/>
  <text x="180" y="340" font-family="Arial, sans-serif" font-size="50" fill="white" text-anchor="middle" font-weight="bold">NPM</text>
  
  <!-- Title -->
  <text x="280" y="280" font-family="Arial, sans-serif" font-size="64" fill="white" font-weight="bold">
    Node Release POC
  </text>
  
  <!-- Subtitle -->
  <text x="280" y="340" font-family="Arial, sans-serif" font-size="32" fill="#94a3b8">
    Manual Release Workflow with Standard-Version
  </text>
  
  <!-- Features -->
  <text x="280" y="395" font-family="Arial, sans-serif" font-size="24" fill="#cbd5e1">
    ✓ Semantic Versioning  ✓ Conventional Commits  ✓ Automated Changelog
  </text>
  
  <!-- Footer -->
  <text x="640" y="580" font-family="Arial, sans-serif" font-size="20" fill="#94a3b8" text-anchor="middle">
    GitHub Actions • Express.js • Jest • Docker
  </text>
</svg>
